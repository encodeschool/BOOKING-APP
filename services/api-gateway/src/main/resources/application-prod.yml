server:
  port: 9087
  address: 0.0.0.0

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/businesses/**,/api/services/**,/api/staff/**,/api/working-hours/**,/api/staff/working-hours/**

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: uploads-route
          uri: lb://core-service
          predicates:
            - Path=/uploads/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://service-registry:9761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: api-gateway

jwt:
  secret: ${JWT_SECRET:mysupersecuresecretkeythatisatleast32characterslong123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
